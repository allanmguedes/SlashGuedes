name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing SemVer tag to build and publish
        required: true
        default: v3.2.0
        type: string

permissions:
  contents: read

jobs:
  validate-build-release:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      stableVersion: ${{ steps.version.outputs.stableVersion }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.source.outputs.sha }}
      portableZip: ${{ steps.package.outputs.portableZip }}
      portableChecksum: ${{ steps.package.outputs.portableChecksum }}

    steps:
      - name: Resolve and validate release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = switch ($env:GITHUB_EVENT_NAME) {
            'workflow_dispatch' { $env:RELEASE_TAG_INPUT }
            'push' { $env:GITHUB_REF_NAME }
            default { throw 'Evento de publicação inválido.' }
          }
          $match = [regex]::Match($tag, '\Av(?<base>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))(?:-(?<prerelease>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?\z')
          if (-not $match.Success) {
            throw 'A tag não segue vX.Y.Z ou SemVer prerelease.'
          }
          $suffix = $match.Groups['prerelease'].Value
          foreach ($identifier in $suffix.Split('.')) {
            if ($identifier -cmatch '\A[0-9]+\z' -and $identifier.Length -gt 1 -and $identifier[0] -eq '0') {
              throw 'Identificador numérico prerelease não pode começar com zero.'
            }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          "stableVersion=$($match.Groups['base'].Value)" >> $env:GITHUB_OUTPUT
          "prerelease=$((-not [string]::IsNullOrEmpty($suffix)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate project version and tag source
        id: source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_BASE_VERSION: ${{ steps.version.outputs.stableVersion }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          [xml]$project = Get-Content src/SlashText/SlashText.csproj -Raw
          $projectVersion = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($projectVersion -ne $env:RELEASE_BASE_VERSION) {
            throw "A tag $tag não corresponde à versão $projectVersion do projeto."
          }
          $tagSha = git rev-parse "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível resolver a tag existente.' }
          $headSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível resolver o checkout.' }
          if ($tagSha -ne $headSha) { throw 'O checkout não corresponde ao commit da tag.' }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível conferir o histórico da main.' }
          git merge-base --is-ancestor $tagSha origin/main
          if ($LASTEXITCODE -eq 1) { throw 'O commit da tag não pertence ao histórico da main.' }
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível verificar a origem do commit da tag.' }
          "sha=$headSha" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SlashText.sln -p:Platform=x64

      - name: Build Release x64
        run: dotnet build SlashText.sln --configuration Release --no-restore -p:Platform=x64

      - name: UI integrity smoke
        shell: pwsh
        run: |
          ./scripts/compare-ui-inventory.ps1
          ./scripts/ui-integrity-smoke.ps1

      - name: Behavioral smoke tests
        run: dotnet run --project tests/SlashText.SmokeTests/SlashText.SmokeTests.csproj --configuration Release --no-build -p:Platform=x64

      - name: Restore win-x64 runtime
        run: dotnet restore src/SlashText/SlashText.csproj --runtime win-x64 -p:Platform=x64

      - name: Publish portable single file
        run: >
          dotnet publish src/SlashText/SlashText.csproj
          --configuration Release
          -p:Platform=x64
          -p:PublishProfile=Portable
          --no-restore
          --output publish-portable

      - name: Publish installed staging
        run: >
          dotnet publish src/SlashText/SlashText.csproj
          --configuration Release
          -p:Platform=x64
          -p:PublishProfile=Installed
          --no-restore
          --output publish-installed

      - name: Package and calculate SHA-256
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $portableFiles = Get-ChildItem publish-portable -Force
          if ($portableFiles.Count -ne 1 -or $portableFiles[0].Name -ne 'SlashDesk.exe') {
            throw 'A Release portátil deve conter somente SlashDesk.exe.'
          }
          New-Item release-assets -ItemType Directory | Out-Null
          $portableZip = "release-assets/SlashDesk-$version-portable-win-x64.zip"
          Compress-Archive -Path publish-portable/SlashDesk.exe -DestinationPath $portableZip
          $portableHash = (Get-FileHash $portableZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$portableHash  $(Split-Path $portableZip -Leaf)" |
            Set-Content "$portableZip.sha256" -Encoding ascii -NoNewline

          $installedZip = "release-assets/SlashDesk-$version-installed-staging-win-x64.zip"
          Compress-Archive -Path publish-installed/* -DestinationPath $installedZip
          $installedHash = (Get-FileHash $installedZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installedHash  $(Split-Path $installedZip -Leaf)" |
            Set-Content "$installedZip.sha256" -Encoding ascii -NoNewline

          "portableZip=$portableZip" >> $env:GITHUB_OUTPUT
          "portableChecksum=$portableZip.sha256" >> $env:GITHUB_OUTPUT

      - name: Upload temporary Actions artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SlashDesk-${{ steps.version.outputs.version }}-release-validation
          path: release-assets/
          if-no-files-found: error

  publish-release:
    needs: validate-build-release
    runs-on: windows-latest
    permissions:
      contents: write
    environment: release-approval

    steps:
      - name: Checkout validated tag commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate-build-release.outputs.sha }}
          persist-credentials: false

      - name: Download validated release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SlashDesk-${{ needs.validate-build-release.outputs.version }}-release-validation
          path: release-assets/

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-build-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-build-release.outputs.version }}
          RELEASE_BASE_VERSION: ${{ needs.validate-build-release.outputs.stableVersion }}
          RELEASE_PRERELEASE: ${{ needs.validate-build-release.outputs.prerelease }}
          PORTABLE_ZIP: ${{ needs.validate-build-release.outputs.portableZip }}
          PORTABLE_CHECKSUM: ${{ needs.validate-build-release.outputs.portableChecksum }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            $env:PORTABLE_ZIP,
            $env:PORTABLE_CHECKSUM,
            '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag',
            '--title', "SlashDesk $env:RELEASE_VERSION"
          )
          $notesPath = "docs/releases/${env:RELEASE_BASE_VERSION}.md"
          if (Test-Path -LiteralPath $notesPath) {
            $arguments += '--notes-file', $notesPath
          } else {
            $arguments += '--generate-notes'
          }
          if ($env:RELEASE_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível publicar a Release.' }
