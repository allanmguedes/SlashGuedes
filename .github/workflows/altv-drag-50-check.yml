name: Alt+V - Janela movel e historico 50

on:
  push:
    branches:
      - feature/altv-drag-history-50

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Restore x64
        run: dotnet restore src/SlashText/SlashText.csproj --runtime win-x64 -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=3.2.1-preview.0
      - name: Build portable x64
        run: dotnet publish src/SlashText/SlashText.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=3.2.1-preview.0 -p:PublishProfile=Portable --no-restore --output publish-altv
      - name: Clipboard checks, migration and saved location
        run: dotnet run --project tests/SlashText.SmokeTests/SlashText.SmokeTests.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=3.2.1-preview.0 -- --guedes-clipboard-checks
      - name: Test real WPF interface
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish-altv/SlashGuedes.exe'
          if (-not (Test-Path $exe)) { throw 'Windows executable missing' }
          $folder = Join-Path $env:RUNNER_TEMP 'SlashGuedes-Drag-50-Smoke'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item $exe (Join-Path $folder 'SlashGuedes.exe')
          $proc = Start-Process -FilePath (Join-Path $folder 'SlashGuedes.exe') -ArgumentList '--guedes-ui-smoke' -PassThru
          if (-not $proc.WaitForExit(35000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'UI smoke timed out'
          }
          if ($proc.ExitCode -ne 0) {
            Get-ChildItem (Join-Path $folder 'SlashGuedesData/Logs') -Filter '*.jsonl' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 25 }
            throw "UI smoke failed with $($proc.ExitCode)"
          }
          Write-Output 'Alt+V window, drag header and clipboard checks OK'
