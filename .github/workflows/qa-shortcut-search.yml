name: QA native shortcuts search validation
on:
  push:
    branches: [fix/qa-shortcut-search-native]
permissions:
  contents: read
jobs:
  ui:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Restore
        shell: pwsh
        run: dotnet restore src/SlashText/SlashText.csproj --runtime win-x64 -p:Platform=x64 -p:SlashGuedesBuild=true
      - name: Build and publish
        shell: pwsh
        run: dotnet publish src/SlashText/SlashText.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true -p:PublishProfile=Portable --no-restore --output qa-exe
      - name: UI startup plus search regression
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'qa-exe/SlashGuedes.exe'
          $root = Join-Path $env:RUNNER_TEMP 'SlashGuedes-QA-Search'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item $exe (Join-Path $root 'SlashGuedes.exe')
          $runner = Start-Process -FilePath (Join-Path $root 'SlashGuedes.exe') -ArgumentList '--guedes-ui-smoke' -PassThru
          if (-not $runner.WaitForExit(45000)) { Stop-Process -Id $runner.Id -Force -ErrorAction SilentlyContinue; throw 'UI smoke timeout' }
          $logs = Join-Path $root 'SlashGuedesData/Logs'
          if ($runner.ExitCode -ne 0) {
            Get-ChildItem $logs -Filter '*.jsonl' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 30 }
            throw "UI regression: $($runner.ExitCode)"
          }
          Write-Output 'Native search and full interface smoke passed'
      - name: Clipboard regression
        shell: pwsh
        run: dotnet run --project tests/SlashText.SmokeTests/SlashText.SmokeTests.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true -- --guedes-clipboard-checks
