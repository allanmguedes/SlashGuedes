name: Clipboard popup Windows validation
on:
  push:
    branches:
      - fix/clipboard-popup-layout-scroll
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clipboard-popup:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Restore
        shell: pwsh
        run: dotnet restore SlashText.sln -p:Platform=x64 -p:SlashGuedesBuild=true
      - name: Build
        shell: pwsh
        run: dotnet build SlashText.sln --configuration Release --no-restore -p:Platform=x64 -p:SlashGuedesBuild=true
      - name: Clipboard smoke
        shell: pwsh
        run: dotnet run --project tests/SlashText.SmokeTests/SlashText.SmokeTests.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true -- --guedes-clipboard-checks
