name: SlashGuedes - Urgent capture settings regression validation

on:
  push:
    branches:
      - fix/urgent-preview117-capture-settings

permissions:
  contents: read

jobs:
  windows-validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Restore x64
        shell: pwsh
        run: dotnet restore src/SlashText/SlashText.csproj --runtime win-x64 -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=3.2.1-preview.0
      - name: Publish Windows executable x64
        shell: pwsh
        run: dotnet publish src/SlashText/SlashText.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=3.2.1-preview.0 -p:PublishProfile=Portable --no-restore --output publish-slashguedes
      - name: Regression - capture shortcuts, history counter and popup settings
        shell: pwsh
        run: dotnet run --project tests/SlashText.SmokeTests/SlashText.SmokeTests.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=3.2.1-preview.0 -- --guedes-clipboard-checks
      - name: Regression - settings storage protection
        shell: pwsh
        run: dotnet run --project tests/SlashText.SmokeTests/SlashText.SmokeTests.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=3.2.1-preview.0 -- --protected-storage-smoke "$env:RUNNER_TEMP/SlashGuedesProtectedSettings"
      - name: Regression - backup compatibility
        shell: pwsh
        run: dotnet run --project tests/SlashText.SmokeTests/SlashText.SmokeTests.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=3.2.1-preview.0 -- --backup-compatibility-smoke "$env:RUNNER_TEMP/SlashGuedesBackupCompatibility"
      - name: WPF UI startup and capture shortcut controls
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish-slashguedes/SlashGuedes.exe'
          if (-not (Test-Path $exe)) { throw 'Missing executable' }
          $folder = Join-Path $env:RUNNER_TEMP 'SlashGuedes-Capture-UI'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item $exe (Join-Path $folder 'SlashGuedes.exe')
          $run = Start-Process -FilePath (Join-Path $folder 'SlashGuedes.exe') -ArgumentList '--guedes-ui-smoke' -PassThru
          if (-not $run.WaitForExit(35000)) {
            Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue
            throw 'UI regression timeout'
          }
          if ($run.ExitCode -ne 0) {
            $logFolder = Join-Path $folder 'SlashGuedesData/Logs'
            Get-ChildItem $logFolder -Filter '*.jsonl' -ErrorAction SilentlyContinue | ForEach-Object {
              Get-Content $_.FullName | Select-Object -Last 25
            }
            throw "WPF regression failed: $($run.ExitCode)"
          }
          Write-Output 'WPF UI passed'
