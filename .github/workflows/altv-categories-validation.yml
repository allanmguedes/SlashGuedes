name: Alt+V - Validacao de categorias (Windows)

on:
  push:
    branches:
      - feature/altv-categories-organize

permissions:
  contents: read

jobs:
  validation:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/SlashText/SlashText.csproj --runtime win-x64 -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=3.2.1-preview.0
      - name: Build Windows
        run: dotnet build src/SlashText/SlashText.csproj --configuration Release --no-restore -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=3.2.1-preview.0
      - name: Clipboard categories, retention and multiple prints
        run: dotnet run --project tests/SlashText.SmokeTests/SlashText.SmokeTests.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=3.2.1-preview.0 -- --guedes-clipboard-checks
      - name: Build portable Windows executable
        run: dotnet publish src/SlashText/SlashText.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=3.2.1-preview.0 -p:PublishProfile=Portable --no-restore --output publish-altv
      - name: UI smoke including selection modes
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish-altv/SlashGuedes.exe'
          if (-not (Test-Path $exe)) { throw 'Executable missing' }
          $folder = Join-Path $env:RUNNER_TEMP 'AltV-Validation'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item $exe (Join-Path $folder 'SlashGuedes.exe')
          $runner = Start-Process -FilePath (Join-Path $folder 'SlashGuedes.exe') -ArgumentList '--guedes-ui-smoke' -PassThru
          if (-not $runner.WaitForExit(35000)) { Stop-Process -Id $runner.Id -Force -ErrorAction SilentlyContinue; throw 'UI smoke timed out' }
          if ($runner.ExitCode -ne 0) {
            Get-ChildItem (Join-Path $folder 'SlashGuedesData/Logs') -Filter '*.jsonl' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 25 }
            throw "UI smoke failed with $($runner.ExitCode)"
          }
          Write-Output 'Alt+V UI smoke passed'
