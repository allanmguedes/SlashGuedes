name: QA - Update alerts Windows
on:
  push:
    branches:
      - fix/guedes-update-notifications
permissions:
  contents: read
jobs:
  updater:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Restore
        shell: pwsh
        run: dotnet restore SlashText.sln -p:Platform=x64 -p:SlashGuedesBuild=true
      - name: Build
        shell: pwsh
        run: dotnet build SlashText.sln --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true --no-restore
      - name: Update and clipboard behavior smoke
        shell: pwsh
        run: dotnet run --project tests/SlashText.SmokeTests/SlashText.SmokeTests.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true -- --guedes-clipboard-checks
      - name: Real Windows UI startup smoke
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/SlashText/bin -Recurse -Filter SlashGuedes.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { throw 'SlashGuedes.exe not found' }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--guedes-ui-smoke' -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw 'UI startup timeout' }
          if ($process.ExitCode -ne 0) { throw "UI smoke failed: $($process.ExitCode)" }
