name: QA - Search caret and input smoke
on:
  push:
    branches:
      - fix/shortcuts-search-native-text-qa
permissions:
  contents: read
jobs:
  qa:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Restore
        shell: pwsh
        run: dotnet restore src/SlashText/SlashText.csproj --runtime win-x64 -p:Platform=x64 -p:SlashGuedesBuild=true
      - name: Build
        shell: pwsh
        run: dotnet build src/SlashText/SlashText.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true --no-restore
      - name: Full UI smoke (Light and Dark)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src/SlashText/bin -Recurse -Filter SlashGuedes.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { throw 'Missing executable' }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--guedes-ui-smoke' -PassThru
          if (-not $process.WaitForExit(50000)) { $process.Kill(); throw 'UI smoke timeout' }
          Write-Output "UI smoke exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "UI smoke failed: $($process.ExitCode)" }
