name: SlashGuedes - Preview Windows x64

on:
  push:
    branches:
      - feature/clipboard-manager
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slashguedes-preview
  cancel-in-progress: true

env:
  GUEDES_VERSION: 3.2.1-preview.${{ github.run_number }}

jobs:
  preview:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    timeout-minutes: 45
    steps:
      - name: Identificar versão
        id: meta
        shell: pwsh
        run: |
          "version=$env:GUEDES_VERSION" >> $env:GITHUB_OUTPUT
          Write-Output "Gerando SlashGuedes $env:GUEDES_VERSION"
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Instalar .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Restaurar dependências
        shell: pwsh
        run: dotnet restore src/SlashText/SlashText.csproj --runtime win-x64 -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=$env:GUEDES_VERSION
      - name: Gerar executável Windows x64
        shell: pwsh
        run: |
          dotnet publish src/SlashText/SlashText.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=$env:GUEDES_VERSION -p:PublishProfile=Portable --no-restore --output publish-slashguedes
      - name: Validar regras de favoritos, retenção e atalhos
        shell: pwsh
        run: |
          dotnet run --project tests/SlashText.SmokeTests/SlashText.SmokeTests.csproj --configuration Release -p:Platform=x64 -p:SlashGuedesBuild=true -p:SlashGuedesVersion=$env:GUEDES_VERSION -- --guedes-clipboard-checks
      - name: Validar executável portátil
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish-slashguedes/SlashGuedes.exe'
          if (-not (Test-Path $exe)) { throw 'SlashGuedes.exe não encontrado.' }
          $product = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion
          if (-not $product.StartsWith($env:GUEDES_VERSION, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Versão do executável inválida: $product (esperada $env:GUEDES_VERSION)"
          }
          $testDir = Join-Path $env:RUNNER_TEMP 'SlashGuedes preview isolado'
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          Copy-Item $exe (Join-Path $testDir 'SlashGuedes.exe')
          $test = Start-Process -FilePath (Join-Path $testDir 'SlashGuedes.exe') -ArgumentList '--portable-smoke' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Teste de inicialização falhou: $($test.ExitCode)" }
          if (-not (Test-Path (Join-Path $testDir 'SlashGuedesData/snippets.md'))) {
            throw 'SlashGuedesData não foi criada, ou dados não estão isolados.'
          }
          Write-Output "SlashGuedes.exe publicado, teste de inicialização OK"
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item $exe (Join-Path package 'SlashGuedes.exe')
          "Versão experimental. Extraia o ZIP e execute SlashGuedes.exe. Seus dados ficam em SlashGuedesData, separados do SlashDesk oficial." |
            Set-Content -LiteralPath package/LEIA-ME.txt -Encoding utf8
      - name: Testar inicialização completa da interface do SlashGuedes
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish-slashguedes/SlashGuedes.exe'
          $folder = Join-Path $env:RUNNER_TEMP 'Guedes-UI-Startup-Check'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item $exe (Join-Path $folder 'SlashGuedes.exe')
          $runner = Start-Process -FilePath (Join-Path $folder 'SlashGuedes.exe') -ArgumentList '--guedes-ui-smoke' -PassThru
          if (-not $runner.WaitForExit(35000)) {
            Stop-Process -Id $runner.Id -Force -ErrorAction SilentlyContinue
            throw 'A inicialização completa excedeu 35 segundos.'
          }
          $logFolder = Join-Path $folder 'SlashGuedesData/Logs'
          $logs = @(Get-ChildItem -Path $logFolder -Filter '*.jsonl' -ErrorAction SilentlyContinue)
          if ($runner.ExitCode -ne 0) {
            foreach ($log in $logs) {
              Get-Content -LiteralPath $log.FullName | Select-Object -Last 30
            }
            throw "A inicialização completa do SlashGuedes falhou: $($runner.ExitCode)"
          }
          if ($logs.Count -eq 0) { throw 'Nenhum diagnóstico de inicialização criado.' }
          if (Select-String -Path $logs.FullName -Pattern 'startup.shell.failed|startup.module.failed' -Quiet) {
            throw 'Houve erro em um módulo durante o smoke test.'
          }
          Write-Output 'Inicialização real de interface, temas e serviços: OK'
      - name: Preparar ZIP de atualização e SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $zip = "release-assets/SlashGuedes-$env:GUEDES_VERSION-portable-win-x64.zip"
          Compress-Archive -LiteralPath "publish-slashguedes/SlashGuedes.exe" -DestinationPath $zip
          $name = Split-Path $zip -Leaf
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii -NoNewline
          Write-Output "Release pronta: $name · SHA-256 $hash"
      - name: Arquivar pacote de atualização
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SlashGuedes-release-assets
          path: release-assets/
          retention-days: 30
          if-no-files-found: error
      - name: Entregar ZIP portátil
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SlashGuedes-win-x64
          path: package/
          retention-days: 30
          if-no-files-found: error

  release:
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Recuperar pacote testado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SlashGuedes-release-assets
          path: release-assets/
      - name: Publicar nova Preview no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GUEDES_TAG: v${{ needs.preview.outputs.version }}
        run: |
          set -euo pipefail
          version="${GUEDES_TAG#v}"
          zip="release-assets/SlashGuedes-${version}-portable-win-x64.zip"
          test -s "$zip"
          test -s "$zip.sha256"
          printf '%s\n' \
            "SlashGuedes $version — canal Preview" \
            "" \
            "- Atualizador próprio: consulta apenas allanmguedes/SlashGuedes." \
            "- Verificação SHA-256 e recuperação se a instalação falhar." \
            "- Arquivos do usuário preservados em SlashGuedesData." \
            "- Versão de testes. As novas atualizações exigem sua confirmação." \
            "" \
            "Primeira migração: usuários da Preview 01/02 devem baixar este EXE uma vez." > release-notes.md
          gh release create "$GUEDES_TAG" "$zip" "$zip.sha256" \
            --repo "allanmguedes/SlashGuedes" \
            --target "$GITHUB_SHA" \
            --title "SlashGuedes $version" \
            --notes-file release-notes.md \
            --prerelease
