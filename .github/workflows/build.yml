name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, agent/slashdesk-shortcuts-v2-splitters, agent/slashdesk-functional-reliability, feat/capture-toolbar-fluent, feat/capture-toolbar-visual-contract, feat/capture-toolbar-visual-integration, feat/fluent-redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SlashText.sln -p:Platform=x64

      - name: Build
        run: dotnet build SlashText.sln --configuration Release --no-restore -p:Platform=x64

      - name: Shortcuts workspace real WPF smoke
        shell: pwsh
        run: |
          ./scripts/shortcuts-workspace-smoke.ps1
          $exe = Get-ChildItem src/SlashText/bin -Recurse -Filter SlashDesk.exe | Select-Object -First 1
          if (-not $exe) { throw 'Build executable not found' }
          $output = Join-Path $PWD 'shortcuts-evidence'
          $stderr = Join-Path $PWD 'shortcuts-stderr.txt'
          $stdout = Join-Path $PWD 'shortcuts-stdout.txt'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--shortcuts-workspace-smoke `"$output`"" -RedirectStandardError $stderr -RedirectStandardOutput $stdout -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Shortcuts smoke timed out' }
          if ($process.ExitCode -ne 0) {
            if (Test-Path "$output/failure.txt") { Get-Content "$output/failure.txt" }
            if (Test-Path $stderr) { Get-Content $stderr }
            if (Test-Path $stdout) { Get-Content $stdout }
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error' } | Select-Object -First 3 -ExpandProperty Message
            throw "Shortcuts smoke failed: $($process.ExitCode)"
          }
          if (-not (Test-Path "$output/result.txt")) { throw 'Shortcuts smoke produced no result' }
          Get-Content "$output/result.txt"

      - name: Upload shortcuts workspace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SlashDesk-shortcuts-workspace-evidence
          path: shortcuts-evidence/
          if-no-files-found: warn

      - name: Quick Accent real WPF controls and persistence
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/SlashText/bin -Recurse -Filter SlashDesk.exe | Select-Object -First 1
          if (-not $exe) { throw 'Build executable not found' }
          $output = Join-Path $PWD 'quick-accent-evidence'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--quick-accent-smoke `"$output`"" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Quick Accent smoke timed out' }
          if ($process.ExitCode -ne 0) { Get-Content "$output/failure.txt" -ErrorAction SilentlyContinue; throw 'Quick Accent smoke failed' }
          if (-not (Test-Path "$output/result.txt")) { throw 'Quick Accent smoke produced no result' }
          Get-Content "$output/result.txt"

      - name: Upload Quick Accent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SlashDesk-quick-accent-controls-evidence
          path: quick-accent-evidence/
          if-no-files-found: warn

      - name: Statistics real WPF metrics and presentation
        shell: pwsh
        run: |
          ./scripts/visual-foundation-smoke.ps1
          $exe = Get-ChildItem src/SlashText/bin -Recurse -Filter SlashDesk.exe | Select-Object -First 1
          $output = Join-Path $PWD 'statistics-evidence'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--statistics-smoke `"$output`"" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Statistics smoke timed out' }
          if ($process.ExitCode -ne 0) { Get-Content "$output/failure.txt" -ErrorAction SilentlyContinue; throw 'Statistics smoke failed' }
          Get-Content "$output/result.txt"

      - name: Upload statistics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SlashDesk-statistics-controls-evidence
          path: statistics-evidence/
          if-no-files-found: warn

      - name: Visual foundation contract and gallery smoke
        shell: pwsh
        run: |
          ./scripts/visual-foundation-smoke.ps1
          $exe = Get-ChildItem src/SlashText/bin -Recurse -Filter SlashDesk.exe | Select-Object -First 1
          if (-not $exe) { throw 'Build executable not found' }
          $output = Join-Path $PWD 'gallery-evidence'
          $stderr = Join-Path $PWD 'gallery-stderr.txt'
          $stdout = Join-Path $PWD 'gallery-stdout.txt'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--design-gallery-smoke `"$output`"" -WindowStyle Hidden -RedirectStandardError $stderr -RedirectStandardOutput $stdout -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Gallery smoke timed out' }
          if ($process.ExitCode -ne 0) {
            if (Test-Path "$output/failure.txt") { Get-Content "$output/failure.txt" }
            if (Test-Path $stderr) { Get-Content $stderr }
            if (Test-Path $stdout) { Get-Content $stdout }
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error' } | Select-Object -First 3 -ExpandProperty Message
            throw "Gallery smoke failed: $($process.ExitCode)"
          }
          if (-not (Test-Path "$output/result.txt")) { throw 'Gallery smoke produced no result' }
          Get-Content "$output/result.txt"

      - name: Upload visual foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SlashDesk-visual-foundation-evidence
          path: gallery-evidence/
          if-no-files-found: warn

      - name: UI inventory comparison
        shell: pwsh
        run: ./scripts/compare-ui-inventory.ps1

      - name: UI integrity smoke
        shell: pwsh
        run: ./scripts/ui-integrity-smoke.ps1

      - name: Capture pilot 3.3.0 smoke
        shell: pwsh
        run: ./scripts/capture-pilot-smoke.ps1

      - name: Release workflow smoke
        shell: pwsh
        run: ./scripts/release-workflow-smoke.ps1

      - name: Capture toolbar Visual Contract smoke
        shell: pwsh
        run: ./scripts/capture-toolbar-visual-contract-smoke.ps1

      - name: Smoke tests
        run: dotnet run --project tests/SlashText.SmokeTests/SlashText.SmokeTests.csproj --configuration Release --no-build -p:Platform=x64

      - name: Restore portable runtime
        run: dotnet restore src/SlashText/SlashText.csproj --runtime win-x64 -p:Platform=x64

      - name: Publish installed staging
        run: >
          dotnet publish src/SlashText/SlashText.csproj
          --configuration Release
          -p:Platform=x64
          -p:PublishProfile=Installed
          --no-restore
          --output publish-installed

      - name: Publish portable single file
        run: >
          dotnet publish src/SlashText/SlashText.csproj
          --configuration Release
          -p:Platform=x64
          -p:PublishProfile=Portable
          --no-restore
          --output publish-portable

      - name: Validate portable package and clean-folder startup
        shell: pwsh
        run: |
          $installedRecorder = Get-ChildItem publish-installed -Recurse -File |
            Where-Object { $_.Name -like 'ScreenRecorderLib*' }
          if ($installedRecorder.Count -lt 1) {
            throw "O staging instalado não contém o ScreenRecorderLib necessário."
          }
          $published = Get-ChildItem publish-portable -Force
          if ($published.Count -ne 1 -or $published[0].Name -ne 'SlashDesk.exe') {
            throw "O portátil deve publicar somente SlashDesk.exe. Encontrado: $($published.Name -join ', ')"
          }
          New-Item package -ItemType Directory | Out-Null
          Copy-Item publish-portable/SlashDesk.exe package/SlashDesk.exe
          $probe = Join-Path $env:RUNNER_TEMP 'SlashDesk portátil çã com espaços'
          New-Item $probe -ItemType Directory -Force | Out-Null
          Copy-Item package/SlashDesk.exe (Join-Path $probe 'SlashDesk.exe')
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $env:RUNNER_TEMP 'slashdesk-bundle-cache'
          $smoke = Start-Process `
            -FilePath (Join-Path $probe 'SlashDesk.exe') `
            -ArgumentList '--portable-smoke' `
            -Wait `
            -PassThru
          if ($smoke.ExitCode -ne 0) {
            throw "O executável portátil falhou no smoke test com código $($smoke.ExitCode)."
          }
          $visible = Get-ChildItem $probe -Force
          $visibleNames = $visible.Name | Sort-Object
          if ($visible.Count -ne 2 -or
              -not ($visibleNames -contains 'SlashDesk.exe') -or
              -not ($visibleNames -contains 'SlashDeskData')) {
            throw "Após iniciar, o portátil deve conter somente SlashDesk.exe e SlashDeskData."
          }
          $dataDirectory = Join-Path $probe 'SlashDeskData'
          if (-not (Test-Path (Join-Path $dataDirectory 'snippets.md'))) {
            throw "O smoke test não criou os dados ao lado do executável portátil."
          }
          $hash = (Get-FileHash package/SlashDesk.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item package/SlashDesk.exe).Length
          "Portable initial visible files: $($published.Count)"
          "Portable visible entries after first run: $($visible.Count)"
          "Portable EXE bytes: $bytes"
          "Portable SHA-256: $hash"
          New-Item package/SlashDeskData -ItemType Directory -Force | Out-Null
          Copy-Item snippets.md package/SlashDeskData/snippets.md
          $packageFiles = Get-ChildItem package -Recurse -File |
            ForEach-Object { $_.FullName.Substring((Resolve-Path package).Path.Length + 1).Replace('\', '/') } |
            Sort-Object
          if (($packageFiles -join ',') -ne 'SlashDesk.exe,SlashDeskData/snippets.md') {
            throw "O candidato deve conter somente SlashDesk.exe e SlashDeskData/snippets.md."
          }

      - name: Create capture toolbar visual preview package
        shell: pwsh
        run: |
          New-Item preview-package -ItemType Directory -Force | Out-Null
          Copy-Item publish-portable/SlashDesk.exe preview-package/SlashDesk.exe
          Set-Content -Path preview-package/Abrir-Preview.cmd -Encoding ascii -Value '@echo off', 'start "" "%~dp0SlashDesk.exe" --capture-toolbar-preview'

      - name: Create visual foundation gallery package
        shell: pwsh
        run: |
          New-Item gallery-package -ItemType Directory -Force | Out-Null
          Copy-Item publish-portable/SlashDesk.exe gallery-package/SlashDesk.exe
          Set-Content -Path gallery-package/Abrir-Galeria.cmd -Encoding ascii -Value '@echo off', 'start "" "%~dp0SlashDesk.exe" --design-gallery'

      - name: Publish isolated capture pilot
        run: >
          dotnet publish src/SlashText/SlashText.csproj
          --configuration Release
          -p:Platform=x64
          -p:PublishProfile=Portable
          -p:CaptureComplementsPilotBuild=true
          --no-restore
          --output publish-capture-pilot

      - name: Create capture pilot package
        shell: pwsh
        run: |
          New-Item capture-pilot-package -ItemType Directory -Force | Out-Null
          Copy-Item publish-capture-pilot/SlashDesk.exe capture-pilot-package/SlashDesk.exe
          Copy-Item docs/capture-complements-pilot-testing.md capture-pilot-package/LEIA-ANTES.md
          Set-Content -Path capture-pilot-package/Abrir-Piloto-Captura.cmd -Encoding ascii -Value '@echo off', 'start "" "%~dp0SlashDesk.exe"'

      - name: Validate isolated pilot clean-folder startup
        shell: pwsh
        run: |
          $pilotProbe = Join-Path $env:RUNNER_TEMP 'SlashDesk piloto isolado'
          New-Item $pilotProbe -ItemType Directory -Force | Out-Null
          Copy-Item publish-capture-pilot/SlashDesk.exe (Join-Path $pilotProbe 'SlashDesk.exe')
          $pilotSmoke = Start-Process -FilePath (Join-Path $pilotProbe 'SlashDesk.exe') -ArgumentList '--portable-smoke' -Wait -PassThru
          if ($pilotSmoke.ExitCode -ne 0) { throw "Pilot startup failed: $($pilotSmoke.ExitCode)" }
          if (-not (Test-Path (Join-Path $pilotProbe 'SlashDeskPilotData/snippets.md'))) { throw 'Pilot metadata/data isolation absent' }
          if (Test-Path (Join-Path $pilotProbe 'SlashDeskData')) { throw 'Pilot created the official portable data directory' }

      - name: Publish isolated shortcuts pilot
        run: >
          dotnet publish src/SlashText/SlashText.csproj
          --configuration Release
          -p:Platform=x64
          -p:PublishProfile=Portable
          -p:ShortcutsPilotBuild=true
          --no-restore
          --output publish-shortcuts-pilot

      - name: Package and validate isolated shortcuts pilot
        shell: pwsh
        run: |
          New-Item shortcuts-pilot-package -ItemType Directory -Force | Out-Null
          Copy-Item publish-shortcuts-pilot/SlashDesk.exe shortcuts-pilot-package/SlashDesk.exe
          Copy-Item docs/shortcuts-workspace-pilot-testing.md shortcuts-pilot-package/LEIA-ANTES.md
          Set-Content -Path shortcuts-pilot-package/Abrir-Piloto-Atalhos.cmd -Encoding ascii -Value '@echo off', 'start "" "%~dp0SlashDesk.exe"'
          $probe = Join-Path $env:RUNNER_TEMP 'SlashDesk Atalhos piloto çã'
          New-Item "$probe/SlashDeskData" -ItemType Directory -Force | Out-Null
          Set-Content "$probe/SlashDeskData/snippets.md" 'official-data-sentinel' -NoNewline
          $before = (Get-FileHash "$probe/SlashDeskData/snippets.md").Hash
          Copy-Item publish-shortcuts-pilot/SlashDesk.exe "$probe/SlashDesk.exe"
          $smoke = Start-Process -FilePath "$probe/SlashDesk.exe" -ArgumentList '--portable-smoke' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Shortcuts pilot startup failed: $($smoke.ExitCode)" }
          if (-not (Test-Path "$probe/SlashDeskPilotData/snippets.md")) { throw 'Shortcuts pilot data isolation absent' }
          if ($before -ne (Get-FileHash "$probe/SlashDeskData/snippets.md").Hash) { throw 'Shortcuts pilot modified official data' }
          if ((Get-ChildItem "$probe/SlashDeskData" -Force).Count -ne 1) { throw 'Shortcuts pilot created official data files' }
          Get-FileHash shortcuts-pilot-package/SlashDesk.exe -Algorithm SHA256

      - name: Upload shortcuts pilot candidate
        uses: actions/upload-artifact@v4
        with:
          name: SlashDesk-3.3.0-shortcuts-pilot-win-x64
          path: shortcuts-pilot-package/
          if-no-files-found: error

      - name: Upload visual foundation gallery
        uses: actions/upload-artifact@v4
        with:
          name: SlashDesk-visual-foundation-gallery-win-x64
          path: gallery-package/
          if-no-files-found: error

      - name: Upload capture pilot candidate
        uses: actions/upload-artifact@v4
        with:
          name: SlashDesk-3.3.0-capture-complements-pilot-win-x64
          path: capture-pilot-package/
          if-no-files-found: error

      - name: Upload installed staging
        uses: actions/upload-artifact@v4
        with:
          name: SlashDesk-3.2.0-installed-staging-win-x64
          path: publish-installed/
          if-no-files-found: error

      - name: Upload portable test candidate
        uses: actions/upload-artifact@v4
        with:
          name: SlashDesk-3.2.0-portable-test-candidate-win-x64
          path: package/
          if-no-files-found: error

      - name: Upload capture toolbar visual preview
        uses: actions/upload-artifact@v4
        with:
          name: SlashDesk-capture-toolbar-visual-preview-win-x64
          path: preview-package/
          if-no-files-found: error
